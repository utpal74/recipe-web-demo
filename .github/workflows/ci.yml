name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=10

    env:
      MONGO_URI: mongodb://localhost:27017/recipe-app
      REDIS_ADDR: localhost:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25.3"

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            if bash -c "cat < /dev/tcp/localhost/27017" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          for i in $(seq 1 30); do
            if bash -c "cat < /dev/tcp/localhost/6379" >/dev/null 2>&1; then break; fi
            sleep 1
          done

      - name: Seed database
        run: go run ./cmd/seed

      - name: Run tests
        run: go test ./... -v
